version: "3.8"

services:
  # ============================================================
  # API Gateway
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - shipping-service
      - frontend-service
    networks:
      - ecom-network
    restart: unless-stopped

  # ============================================================
  # Databases (one per service)
  # ============================================================
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  product-db:
    image: postgres:15-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  cart-db:
    image: postgres:15-alpine
    container_name: cart-db
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  shipping-db:
    image: postgres:15-alpine
    container_name: shipping-db
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - shipping_db_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    restart: unless-stopped

  # ============================================================
  # Redis - Cache & lightweight queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ecom-network
    restart: unless-stopped

  # ============================================================
  # Neo4j - Graph Database for AI
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - ecom-network
    restart: unless-stopped

  # ============================================================
  # Microservices
  # ============================================================
  user-service:
    build: ../user-service
    container_name: user-service
    environment:
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: user-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
    depends_on:
      - user-db
    networks:
      - ecom-network
    restart: unless-stopped

  product-service:
    build: ../product-service
    container_name: product-service
    environment:
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: product-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
    depends_on:
      - product-db
    networks:
      - ecom-network
    restart: unless-stopped

  cart-service:
    build: ../cart-service
    container_name: cart-service
    environment:
      DB_NAME: cart_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: cart-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
      PRODUCT_SERVICE_URL: http://product-service:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - cart-db
      - redis
      - product-service
    networks:
      - ecom-network
    restart: unless-stopped

  order-service:
    build: ../order-service
    container_name: order-service
    environment:
      DB_NAME: order_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: order-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
      PRODUCT_SERVICE_URL: http://product-service:8000
      CART_SERVICE_URL: http://cart-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      SHIPPING_SERVICE_URL: http://shipping-service:8000
      USER_SERVICE_URL: http://user-service:8000
    depends_on:
      - order-db
      - product-service
      - cart-service
    networks:
      - ecom-network
    restart: unless-stopped

  payment-service:
    build: ../payment-service
    container_name: payment-service
    environment:
      DB_NAME: payment_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: payment-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
      ORDER_SERVICE_URL: http://order-service:8000
    depends_on:
      - payment-db
    networks:
      - ecom-network
    restart: unless-stopped

  shipping-service:
    build: ../shipping-service
    container_name: shipping-service
    environment:
      DB_NAME: shipping_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: shipping-db
      DB_PORT: 5432
      SECRET_KEY: super-secret-jwt-key-change-in-production-2024
      DEBUG: "True"
      ORDER_SERVICE_URL: http://order-service:8000
    depends_on:
      - shipping-db
    networks:
      - ecom-network
    restart: unless-stopped

  ai-service:
    build: ../ai-service
    container_name: ai-service
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      REDIS_URL: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      - redis
      - product-service
      - neo4j
    networks:
      - ecom-network
    restart: unless-stopped

  frontend-service:
    build: ../frontend
    container_name: frontend-service
    networks:
      - ecom-network
    restart: unless-stopped

networks:
  ecom-network:
    driver: bridge

volumes:
  user_db_data:
  product_db_data:
  cart_db_data:
  order_db_data:
  payment_db_data:
  shipping_db_data:
  neo4j_data:
