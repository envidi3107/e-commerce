events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=10r/s;

    # Upstream definitions (load-balancing ready)
    upstream user_service {
        server user-service:8000;
    }
    upstream product_service {
        server product-service:8000;
    }
    upstream cart_service {
        server cart-service:8000;
    }
    upstream order_service {
        server order-service:8000;
    }
    upstream payment_service {
        server payment-service:8000;
    }
    upstream shipping_service {
        server shipping-service:8000;
    }
    upstream ai_service {
        server ai-service:8006;
    }
    upstream frontend_service {
        server frontend-service:80;
    }

    server {
        listen 80;
        server_name localhost;

        # ----- CORS (applied to all responses via 'always' flag) -----
        # Use explicit origin for credentialed browser requests (don't use '*')
        add_header 'Access-Control-Allow-Origin'  'http://localhost'                             always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'        always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-User-ID' always;
        add_header 'Access-Control-Allow-Credentials' 'true'                                       always;

        # Handle OPTIONS requests at the end with a catch-all location


        # ----- Common proxy settings -----
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        
        # Macro for common proxy headers (must be redeclared in each location)
        # Use this for each location:
        # proxy_set_header Host              $host;
        # proxy_set_header X-Real-IP         $remote_addr;
        # proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Authorization     $http_authorization;

        # ============================================================
        # Auth endpoints (stricter rate limit)
        # ============================================================
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # User Service
        # ============================================================
        location /api/users/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # Product Service
        # ============================================================
        location /api/products/ {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://product_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        location /api/categories/ {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://product_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        location /api/inventory/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://product_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # Cart Service
        # ============================================================
        location /api/cart/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://cart_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # Order Service
        # ============================================================
        location /api/orders/ {
            limit_req zone=general burst=15 nodelay;
            proxy_pass http://order_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # Payment Service
        # ============================================================
        location /api/payments/ {
            limit_req zone=payment burst=10 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # Shipping Service
        # ============================================================
        location /api/shipping/ {
            limit_req zone=general burst=15 nodelay;
            proxy_pass http://shipping_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Authorization      $http_authorization;
        }

        # ============================================================
        # AI Service
        # ============================================================
        location /api/search/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        location /api/recommendations/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        location /api/trending/ {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        location /api/chatbot/ {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        location /api/ai/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://ai_service;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ============================================================
        # API Gateway Health Check
        # ============================================================
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api-gateway"}';
        }

        # Swagger UI (per service) - pass through
        location ~ ^/docs/(users|products|cart|orders|payments|shipping)/ {
            rewrite ^/docs/users/(.*)$    /api/schema/swagger-ui/$1 break;
            proxy_pass http://user_service;
        }

        # ============================================================
        # Frontend Application
        # ============================================================
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
